<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Would You Rather? — Our Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Universal decorations -->
    <div class="stars"></div>
    <div class="shooting-star"></div>
    <div class="floating-elements">
        <div class="float heart" style="top: 10%; left: 5%;">✨</div>
        <div class="float star" style="top: 20%; right: 8%;">⭐</div>
        <div class="float heart" style="bottom: 15%; left: 10%;">💫</div>
        <div class="float star" style="bottom: 25%; right: 12%;">🌌</div>
    </div>
    <div class="blohsh" title="for billie"></div>

    <!-- Main content -->
    <div class="container">
        <h1 class="glow">🎲 would you rather...?</h1>
        <p class="subtitle">(our edition — no wrong answers, but some are cuter)</p>

        <div class="game-container" id="gameContainer">
            <div class="question" id="question">Loading...</div>
            <div class="options" id="options"></div>
            <div class="feedback" id="feedback"></div>
            <button class="next-btn" id="nextBtn" onclick="nextQuestion()" style="display: none;">next →</button>
        </div>

        <div class="nav">
            <a href="timeline.html" class="back-btn">← back to timeline</a>
            <a href="secret.html" id="secretLink" style="display: none; margin-left: 1rem;" class="btn">🔓 unlock secret page</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
