<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>just for you 🌌</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Universal decorations -->
    <div class="stars"></div>
    <div class="shooting-star"></div>
    <div class="floating-elements">
        <div class="float heart" style="top: 10%; left: 5%;">✨</div>
        <div class="float star" style="top: 20%; right: 8%;">⭐</div>
        <div class="float heart" style="bottom: 15%; left: 10%;">💫</div>
        <div class="float star" style="bottom: 25%; right: 12%;">🌌</div>
    </div>
    <div class="blohsh" title="for billie"></div>

    <!-- Main content -->
    <div class="container">
        <h1 class="glow">💫 you found it 💫</h1>

        <!-- Billie Eilish lyrics - full chorus -->
        <div class="chorus-container">
            <div class="quote-decoration">"</div>
            
            <div class="lyric-line">i love you and i don't want to</div>
            <div class="lyric-line">there's nothing you could do or say</div>
            <div class="lyric-line">i can't escape the way i love you</div>
            <div class="lyric-line">i don't want to, but i love you</div>
            
            <div class="quote-decoration closing">"</div>
            
            <div class="song-credit">— billie eilish</div>
            
            <div class="heart-divider">
                <span>✨ ❤️ ✨</span>
            </div>
            
            <!-- Your personal message -->
            <div class="personal-message">
                <p>you gave me everything i wanted.</p>
                <p>this is my reply.</p>
                <p class="signature">🌌 me</p>
            </div>
        </div>

        <div class="nav">
            <a href="index.html" class="back-btn">← start over</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
